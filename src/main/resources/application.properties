spring.application.name=doctor-office

# --- Database: H2 in-memory (dev only) ---
spring.datasource.url=jdbc:h2:mem:clinic;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# --- H2 console ---
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# --- JWT ---
# DEV ONLY: this default secret is public (it is in git). Override it in every real
# deployment with an environment variable (APP_JWT_SECRET), >= 32 random bytes.
app.jwt.secret=dev-only-secret-change-me-0123456789-abcdef
# Short-lived access token, no refresh token yet.
app.jwt.expiration-minutes=15

# --- Dev seed users ---
# DEV ONLY: creates doctor/assistant users with well-known passwords at startup.
# Must be false (or absent) anywhere real data lives.
app.seed.enabled=true

logging.level.org.hibernate.SQL=DEBUG

